services:
  db:
    image: supabase/postgres:17.6.1.136
    container_name: contable-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contable
    ports:
      - "55432:5432"
    volumes:
      - contable-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contable"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  contable-pg-data:
