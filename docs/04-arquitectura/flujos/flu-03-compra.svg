75" lengthAdjust="spacing" textLength="263.2519" x="48.4375" y="444.3074">Agregar productos o servicios</text><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="179.8513" x="48.4375" y="469.8451">con cantidad y costo</text><line style="stroke:#5A6470;stroke-width:2.3438;" x1="23.4375" x2="23.4375" y1="85.6376" y2="1509.1206"/><rect fill="#EAF1F8" height="56.7877" rx="6.25" ry="6.25" style="stroke:#0C3E65;stroke-width:0.7813;" width="276.3518" x="450.2728" y="522.2139"/><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="245.1018" x="465.8978" y="557.8827">Calcular cr&#233;dito fiscal (13 %)</text><rect fill="#EAF1F8" height="56.7877" rx="6.25" ry="6.25" style="stroke:#0C3E65;stroke-width:0.7813;" width="262.1767" x="457.3603" y="701.1565"/><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="230.9267" x="472.9853" y="736.8254">Aplicar percepci&#243;n del 1 %</text><polygon fill="#FFF4D6" points="428.7631,610.2515,748.1342,610.2515,766.8842,635.7892,748.1342,661.3269,428.7631,661.3269,410.0131,635.7892,428.7631,610.2515" style="stroke:#C98F0A;stroke-width:0.7813;"/><text fill="#000000" font-family="Arial" font-size="17.1875" lengthAdjust="spacing" textLength="12.6671" x="594.6987" y="679.7002">s&#237;</text><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="319.3711" x="428.7631" y="630.2954">&#191;el proveedor es gran contribuyente</text><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="148.0698" x="428.7631" y="655.8331">y la empresa no?</text><text fill="#000000" font-family="Arial" font-size="17.1875" lengthAdjust="spacing" textLength="21.0202" x="766.8842" y="630.7533">no</text><polygon fill="#FFF4D6" points="588.4487,789.1942,607.1987,807.9442,588.4487,826.6942,569.6987,807.9442,588.4487,789.1942" style="stroke:#C98F0A;stroke-width:0.7813;"/><rect fill