<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="795.3125px" preserveAspectRatio="none" style="width:503px;height:795px;background:#FFFFFF;" version="1.1" viewBox="0 0 503 795" width="503.125px" zoomAndPan="magnify"><title>Estados de un per&#237;odo contable</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="Arial" font-size="25" font-weight="bold" lengthAdjust="spacing" textLength="390.7757" x="45.9583" y="42.3501">Estados de un per&#237;odo contable</text></g><g class="entity" data-qualified-name="Abierto" id="ent0002"><rect fill="#EAF1F8" height="107.863" rx="6.25" ry="6.25" style="stroke:#0C3E65;stroke-width:0.7813;" width="236.2077" x="58.3125" y="249.6751"/><line style="stroke:#0C3E65;stroke-width:0.7813;" x1="58.3125" x2="294.5202" y1="290.8377" y2="290.8377"/><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="64.7817" x="144.0255" y="277.5315">Abierto</text><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="204.9577" x="66.125" y="318.6941">admite registrar, editar</text><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="194.0826" x="66.125" y="344.2318">y contabilizar partidas</text></g><g class="entity" data-qualified-name="Cerrado" id="ent0003"><rect fill="#EAF1F8" height="133.4007" rx="6.25" ry="6.25" style="stroke:#0C3E65;stroke-width:0.7813;" width="268.308" x="42.2656" y="499.7219"/><line style="stroke:#0C3E65;stroke-width:0.7813;" x1="42.2656" x2="310.5736" y1="540.8846" y2="540.8846"/><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="71.3068" x="140.7662" y="527.5783">Cerrado</text><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="219.8828" x="50.0781" y="568.741">bloquea partidas y l&#237;neas</text><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="172.6137" x="50.0781" y="594.2787">solo permite anular</text><text fill="#000000" font-family="Arial" font-size="18.75" lengthAdjust="spacing" textLength="237.058" x="50.0781" y="619.8164">(reversi&#243;n en otro per&#237;odo)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="3" id="ent0002"><ellipse cx="176.4063" cy="91.8626" fill="#222222" rx="15.625" ry="15.625" style="stroke:#222222;stroke-width:1.5625;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="9" id="ent0006"><ellipse cx="176.4063" cy="769.0657" fill="none" rx="17.1875" ry="17.1875" style="stroke:#222222;stroke-width:1.5625;"/><ellipse cx="176.4063" cy="769.0657" fill="#222222" rx="9.375" ry="9.375" style="stroke:#222222;stroke-width:1.5625;"/></g><!--link *start* to Abierto--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="3" id="lnk3"><path d="M176.4063,107.7688 C176.4063,136.3938 176.4063,192.5501 176.4063,239.5969" fill="none" id="*start*-to-Abierto" style="stroke:#0C3E65;stroke-width:1.5625;"/><polygon fill="#0C3E65" points="176.4063,248.9719,182.6563,234.9094,176.4063,241.1594,170.1563,234.9094,176.4063,248.9719" style="stroke:#0C3E65;stroke-width:1.5625;"/><text fill="#000000" font-family="Arial" font-size="17.1875" lengthAdjust="spacing" textLength="112.9383" x="206.792" y="174.2984">crear ejercicio</text><text fill="#000000" font-family="Arial" font-size="17.1875" lengthAdjust="spacing" textLength="170.5847" x="177.9688" y="197.7076">(trigger: 12 per&#237;odos)</text></g><!--link Abierto to Cerrado--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="5" id="lnk4"><path d="M68.4219,358.2063 C52.1562,371.0344 37.6094,386.3626 27.9687,404.4094 C9.375,439.2219 23.2639,466.1466 54.7639,493.0685" fill="none" id="Abier